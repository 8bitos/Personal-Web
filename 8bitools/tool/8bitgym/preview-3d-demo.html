<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8BitGym — 3D Mannequin Preview (105 Gerakan)</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-2: #1b2742;
      --border: #263554;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --primary: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 680px;
      margin-inline: auto;
    }
    h1 { margin: 0 0 6px; font-size: 1.25rem; }
    p { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    select, button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }
    select { width: 100%; }
    .viewport {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #070d1a;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    .row { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>8BitGym — Preview 3D Opsi A (Semua 105 Gerakan)</h1>
  <p>Analytic 2-bone IK • Semua sendi terhubung • Drag untuk putar 360° & scroll untuk zoom.</p>

  <div class="card">
    <select id="exSelect"></select>
    <div id="exMeta" style="font-size:0.84rem;color:var(--accent)"></div>
    <div class="viewport" id="stage3d"></div>
    <div class="row">
      <button data-cam="iso">3/4 View</button>
      <button data-cam="side">Samping</button>
      <button data-cam="front">Depan</button>
      <button id="pauseBtn">⏸ Pause</button>
    </div>
  </div>

  <script src="./exercises-data.js"></script>
  <script src="./exercise-animator.js"></script>
  <script src="./three.min.js"></script>
  <script src="./exercise-3d.js"></script>
  <script>
    const sel = document.getElementById('exSelect');
    const exs = window.IRONLOG_CATALOG.EXERCISES;
    exs.forEach((ex, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = `${ex.name} (${ex.muscle} • ${ex.equipment})`;
      sel.appendChild(opt);
    });

    function mountSelected() {
      if (!window.IRONLOG_3D) return;
      const ex = exs[Number(sel.value) || 0];
      const pat = window.IRONLOG_ANIMATOR.getPattern(ex);
      document.getElementById('exMeta').textContent = `Otot: ${ex.muscle}${ex.secondary?.length ? ' (+' + ex.secondary.join(', ') + ')' : ''} • Alat: ${ex.equipment} • Rig: ${pat}`;
      window.IRONLOG_3D.mount(document.getElementById('stage3d'), ex);
    }

    sel.addEventListener('change', mountSelected);
    document.querySelectorAll('[data-cam]').forEach((b) => {
      b.addEventListener('click', () => window.IRONLOG_3D && window.IRONLOG_3D.setCameraPreset(b.dataset.cam));
    });
    document.getElementById('pauseBtn').addEventListener('click', (e) => {
      if (!window.IRONLOG_3D) return;
      const p = window.IRONLOG_3D.togglePause();
      e.target.textContent = p ? '▶ Play' : '⏸ Pause';
    });

    if (window.IRONLOG_3D) mountSelected();
    else window.addEventListener('ironlog3d:ready', mountSelected, { once: true });
  </script>
</body>
</html>
