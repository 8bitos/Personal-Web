<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="themeColorMeta" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>8BitGym — Gym Progress Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,500,0,0" />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('ironlog_state_v1') || '{}');
      if (s && s.settings && s.settings.theme === 'light') {
        document.documentElement.dataset.theme = 'light';
        document.getElementById('themeColorMeta').content = '#f2f2f7';
      }
    } catch (_) {}
  </script>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="brand">
        <img src="./icon.svg" alt="8BitGym" class="brand-icon" />
        <h1 class="brand-title">8BitGym</h1>
      </div>
      <div class="top-actions">
        <button id="syncStatusBtn" class="btn btn-ghost btn-sm sync-pill hidden" data-i18n-title="syncTooltip" title="Sinkronisasi Akun Google">
          <span id="syncDot" class="sync-dot offline"></span>
          <span id="syncLabel" class="sync-label-text">User</span>
        </button>
        <button id="themeToggleBtn" class="btn btn-ghost btn-sm icon-pill" data-i18n-title="themeTooltip" title="Ganti Tema (Gelap / Terang)" aria-label="Toggle Theme"><span class="material-symbols-rounded g-icon" id="themeToggleIcon" aria-hidden="true">dark_mode</span></button>
        <button id="langToggleBtn" class="btn btn-ghost btn-sm icon-pill" title="Ganti Bahasa / Switch Language" aria-label="Switch Language"></button>
        <button id="installBtn" class="btn btn-ghost btn-sm hidden" data-i18n="installBtn" title="Install">
          Install
        </button>
        <button id="settingsBtn" class="icon-btn" data-i18n-aria="settingsAria" data-i18n-title="settingsAria" aria-label="Pengaturan & Backup" title="Pengaturan & Backup">
          <span class="material-symbols-rounded g-icon" aria-hidden="true">settings</span>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Tab 1: Apple Fitness Summary & Workouts -->
      <section id="tab-workout" class="tab-panel active">
        <div class="af-summary-head">
          <div class="af-date-kicker" id="summaryDateLabel"></div>
          <div class="af-summary-title-row">
            <h2 class="af-summary-title" data-i18n="summaryTitle">Ringkasan</h2>
            <span class="badge hidden" id="heroStreakBadge"></span>
          </div>
        </div>

        <div class="card af-rings-card">
          <div id="activityRingsBody" class="af-rings-body"></div>
          <p class="muted" id="heroDesc" style="margin:0" data-i18n="heroNoSession">Belum ada sesi tercatat</p>
          <button id="startEmptyWorkoutBtn" class="btn btn-primary btn-block" data-i18n="startEmptyBtn">
            Mulai Workout
          </button>
        </div>

        <div id="dashboardKpiGrid" class="bento-kpi-grid"></div>
        <div id="weeklyVolumeCard" class="card weekly-card"></div>
        <div id="muscleFocusCard" class="card af-donut-card"></div>

        <div class="section-header">
          <h3 data-i18n="routinesHeading">Routines / Template</h3>
          <div style="display:flex;gap:6px">
            <button id="newFolderBtn" class="btn btn-ghost btn-sm" data-i18n="newFolderBtn">+ Folder</button>
            <button id="newRoutineBtn" class="btn btn-secondary btn-sm" data-i18n="newRoutineBtn">+ Buat Routine</button>
          </div>
        </div>
        <div id="routinesList" class="stack-list"></div>
      </section>

      <!-- Tab 2: History & Weekly Summary -->
      <section id="tab-history" class="tab-panel">
        <div class="stats-grid" id="summaryCards"></div>
        <div id="monthlyReportCard" class="card" style="margin-bottom:14px"></div>
        <div id="calendarCard" class="card" style="margin-bottom:14px"></div>
        <div id="muscleDistCard" class="card" style="margin-bottom:14px"></div>
        <div class="section-header">
          <h3 data-i18n="historyHeading">Riwayat Workout</h3>
          <button id="clearDateFilterBtn" class="btn btn-ghost btn-xs hidden" data-i18n="allDatesBtn">Semua Tanggal</button>
        </div>
        <div id="historyList" class="stack-list"></div>
      </section>

      <!-- Tab 3: Exercises & Progress -->
      <section id="tab-exercises" class="tab-panel">
        <div class="section-header" style="margin-top:4px">
          <div style="display:flex;align-items:center;gap:8px;min-width:0">
            <h3 data-i18n="exercisesHeading">Daftar Latihan & Progress</h3>
            <span id="exercisesCountBadge" class="badge">105</span>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button id="newExerciseBtn" class="btn btn-secondary btn-sm" data-i18n="customExBtn">+ Custom</button>
          </div>
        </div>
        <div class="filter-bar" style="flex-wrap:wrap">
          <input type="search" id="exerciseSearchInput" class="input" data-i18n-placeholder="searchExPlaceholder" placeholder="Cari latihan (mis. Bench Press)..." />
          <div id="muscleChipsBar" class="chip-scroll"></div>
          <select id="muscleFilterSelect" class="input select-sm" style="flex:1">
            <option value="all">Semua Otot</option>
          </select>
          <select id="equipmentFilterSelect" class="input select-sm" style="flex:1">
            <option value="all">Semua Alat</option>
          </select>
        </div>
        <div id="exerciseProgressCard" class="card hidden" style="margin-bottom:14px"></div>
        <div id="exercisesList" class="stack-list"></div>
      </section>

      <!-- Tab 4: Body Measurements -->
      <section id="tab-body" class="tab-panel">
        <div class="section-header" style="margin-top:4px">
          <h3 data-i18n="bodyHeading">Body Measurements</h3>
          <button id="addMeasurementBtn" class="btn btn-primary btn-sm" data-i18n="addMeasBtn">+ Catat Ukuran</button>
        </div>
        <div id="bodyWeightChartCard" class="card" style="margin-bottom:14px"></div>
        <div id="measurementsList" class="stack-list"></div>
      </section>
    </main>

    <!-- Minimized Active Workout Bar -->
    <div id="minimizedWorkoutBar" class="minimized-bar hidden">
      <div class="minimized-info" id="expandWorkoutBtn">
        <span class="pulse-dot"></span>
        <div>
          <strong id="minWorkoutTitle">Workout Aktif</strong>
          <span class="muted" id="minWorkoutTimer">00:00</span>
        </div>
      </div>
      <button id="resumeWorkoutBtn" class="btn btn-primary btn-sm" data-i18n="resumeBtn">Buka</button>
    </div>

    <!-- Rest Timer Pill -->
    <div id="restTimerPill" class="rest-pill hidden">
      <div class="rest-pill-left">
        <span class="muted" data-i18n="restLabel">Istirahat</span>
        <strong id="restTimerDisplay" class="tabular">01:30</strong>
      </div>
      <div class="rest-pill-actions">
        <button id="restMinusBtn" class="btn btn-ghost btn-xs">-15s</button>
        <button id="restPlusBtn" class="btn btn-ghost btn-xs">+15s</button>
        <button id="restSkipBtn" class="btn btn-secondary btn-xs" data-i18n="skipBtn">Skip</button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-item active" data-tab="workout">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="navWorkout">Beranda</span>
      </button>
      <button class="nav-item" data-tab="history">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3" stroke-linecap="round"/>
        </svg>
        <span data-i18n="navHistory">Riwayat</span>
      </button>
      <button class="nav-item" data-tab="exercises">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 17l6-6 4 4 8-8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 7h4v4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="navExercises">Latihan</span>
      </button>
      <button class="nav-item" data-tab="body">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4z"/>
          <path d="M5 20a7 7 0 0 1 14 0" stroke-linecap="round"/>
        </svg>
        <span data-i18n="navBody">Body</span>
      </button>
    </nav>
  </div>

  <!-- Active Workout Fullscreen Sheet -->
  <div id="activeWorkoutSheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-header">
      <button id="minimizeWorkoutBtn" class="icon-btn" data-i18n-title="minimizeTitle" title="Perkecil">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="sheet-title-wrap">
        <input type="text" id="activeWorkoutName" class="title-input" value="Workout" data-i18n-aria="workoutNameAria" aria-label="Nama workout" />
        <div class="sheet-meta">
          <span id="activeWorkoutTimer" class="tabular">00:00</span>
          <span>•</span>
          <span id="activeWorkoutVolume">0 kg</span>
          <span>•</span>
          <span id="activeWorkoutSets">0 set</span>
        </div>
      </div>
      <button id="finishWorkoutBtn" class="btn btn-success btn-sm" data-i18n="finishBtn">Selesai</button>
    </div>

    <div class="sheet-body" id="activeExercisesContainer"></div>

    <div class="sheet-footer">
      <button id="addExerciseToWorkoutBtn" class="btn btn-primary btn-block" data-i18n="addExToWkBtn">+ Tambah Latihan</button>
      <button id="discardWorkoutBtn" class="btn btn-danger-ghost btn-block" data-i18n="discardWkBtn">Batalkan Workout</button>
    </div>
  </div>

  <!-- Modal Backdrop -->
  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal" id="modalContent" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Hidden file input for JSON Import -->
  <input type="file" id="importFileInput" accept="application/json,.json" class="hidden" />

  <script src="./firebase-config.js"></script>
  <script type="module" src="./firebase-sync.js"></script>
  <script src="./i18n.js"></script>
  <script src="./exercises-data.js"></script>
  <script src="./exercise-animator.js"></script>
  <script src="./app.js"></script>
</body>
</html>
