<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#glow)" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Pixel / 8-Bit Grid Subtle Decoration -->
  <g opacity="0.15" fill="#38bdf8">
    <rect x="72" y="72" width="24" height="24" rx="4"/>
    <rect x="104" y="72" width="24" height="24" rx="4"/>
    <rect x="72" y="104" width="24" height="24" rx="4"/>
    <rect x="416" y="416" width="24" height="24" rx="4"/>
    <rect x="384" y="416" width="24" height="24" rx="4"/>
    <rect x="416" y="384" width="24" height="24" rx="4"/>
  </g>

  <!-- Center Graphic: Scanner Crop Frame with Document Page inside -->
  <rect x="106" y="106" width="300" height="300" rx="40" fill="#0f172a" stroke="url(#glow)" stroke-width="10" filter="url(#shadow)"/>
  
  <!-- Perspective Corner Guide Markers -->
  <g stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M140 170 L140 140 L170 140"/>
    <path d="M372 170 L372 140 L342 140"/>
    <path d="M140 342 L140 372 L170 372"/>
    <path d="M372 342 L372 372 L342 372"/>
  </g>

  <!-- Document Sheet -->
  <path d="M180 160 L290 160 L332 202 L332 352 L180 352 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M290 160 L290 202 L332 202 Z" fill="#cbd5e1"/>

  <!-- Document Text Lines -->
  <rect x="206" y="224" width="100" height="10" rx="5" fill="#0284c7"/>
  <rect x="206" y="248" width="100" height="8" rx="4" fill="#94a3b8"/>
  <rect x="206" y="268" width="80" height="8" rx="4" fill="#94a3b8"/>
  <rect x="206" y="288" width="95" height="8" rx="4" fill="#94a3b8"/>

  <!-- PDF Badge -->
  <rect x="206" y="310" width="56" height="22" rx="6" fill="#0284c7"/>
  <text x="234" y="325" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PDF</text>
</svg>
